<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Julien Prudhomme — Java &amp; Spring Developer</title>
  <desc id="description">A dark, minimal banner for Julien Prudhomme, a Java and Spring developer based in France. A restrained cyan JP monogram appears on the right.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#203142" stroke-width="1"/>
    </pattern>
    <linearGradient id="grid-opacity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect x="790" y="24" width="360" height="272" fill="url(#grid-opacity)"/>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0a0f16"/>
  <rect x="790" y="24" width="360" height="272" fill="url(#grid)" mask="url(#grid-mask)" opacity="0.56"/>
  <path d="M 786 52 V 268" fill="none" stroke="#192633"/>

  <path d="M 56 53 H 80" fill="none" stroke="#61d6e5" stroke-width="3" stroke-linecap="round"/>
  <text x="94" y="58" fill="#95a7bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6">J-PRUDHOMME</text>

  <text x="54" y="145" fill="#edf5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="59" font-weight="600" letter-spacing="-2">Julien Prudhomme</text>
  <text x="57" y="191" fill="#61d6e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400">Java &amp; Spring Developer</text>

  <path d="M 57 237 H 675" fill="none" stroke="#1d2a38"/>
  <text x="57" y="273" fill="#a5b5c6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.6">FRANCE</text>
  <circle cx="126" cy="268" r="2" fill="#42586c"/>
  <text x="145" y="273" fill="#7f94aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">github.com/j-prudhomme</text>

  <g aria-hidden="true">
    <rect x="914" y="78" width="184" height="184" rx="14" fill="#0b121b" stroke="#253746"/>
    <rect x="934" y="58" width="184" height="184" rx="14" fill="none" stroke="#304d5b"/>
    <path d="M 934 94 V 72 A 14 14 0 0 1 948 58 H 970" fill="none" stroke="#61d6e5" stroke-width="2"/>
    <text x="1017" y="187" text-anchor="middle" fill="#8ddce6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="79" font-weight="500" letter-spacing="-5">JP</text>
    <circle cx="1097" cy="78" r="3" fill="#61d6e5"/>
    <path d="M 1075 262 H 1118" fill="none" stroke="#365265"/>
    <path d="M 1118 254 V 270" fill="none" stroke="#365265"/>
  </g>
</svg>
